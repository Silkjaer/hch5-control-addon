name: HCH5 Control
version: "1.6.1-silkjaer.7"
slug: hch5_control
description: Local controller and WebUI for a Dantherm HCH5 MK1 or MKII
url: https://github.com/Silkjaer/hch5-control-addon
arch:
  - aarch64
  - amd64
  - armv7
startup: application
boot: auto
init: false
watchdog: http://[HOST]:[PORT:8080]/healthz
ingress: true
ingress_port: 8080
panel_icon: mdi:hvac
panel_title: Ventilation
uart: true
ports:
  8080/tcp: 8088
  4196/tcp: null
  5020/tcp: null
ports_description:
  8080/tcp: Controller API for the Home Assistant integration (the WebUI opens in the sidebar)
  4196/tcp: MK1 raw RS485 mirror for the integration (read-only)
  5020/tcp: MKII Modbus TCP proxy for the integration (read-only)
map:
  - addon_config:rw
  - share:rw
options:
  unit: mk1
  connection: tcp
  read_only: false
schema:
  unit: list(mk1|mk2)
  connection: list(tcp|serial)
  adapter_host: str?
  adapter_port: port?
  serial_device: device(subsystem=tty)?
  mk2_unit_id: int(1,247)?
  read_only: bool
  controller_token: password?
  log_level: list(debug|info|warning|error)?
